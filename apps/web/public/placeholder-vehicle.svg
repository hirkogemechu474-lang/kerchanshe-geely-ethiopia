<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f3f4f6"/>
  <g transform="translate(250,200)">
    <!-- Car body -->
    <path d="M50,120 L80,60 L180,40 L260,60 L280,120 Z" fill="#d1d5db" stroke="#9ca3af" stroke-width="2"/>
    <!-- Roof -->
    <path d="M100,60 L120,20 L220,20 L240,60" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
    <!-- Windows -->
    <path d="M110,58 L125,25 L170,25 L170,58 Z" fill="#bfdbfe" stroke="#9ca3af" stroke-width="1"/>
    <path d="M175,58 L175,25 L215,25 L230,58 Z" fill="#bfdbfe" stroke="#9ca3af" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="100" cy="130" r="22" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <circle cx="100" cy="130" r="10" fill="#6b7280"/>
    <circle cx="240" cy="130" r="22" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <circle cx="240" cy="130" r="10" fill="#6b7280"/>
    <!-- Headlights -->
    <rect x="270" y="90" width="15" height="10" rx="3" fill="#fbbf24"/>
    <rect x="55" y="90" width="15" height="10" rx="3" fill="#fbbf24"/>
    <!-- Ground line -->
    <line x1="20" y1="152" x2="310" y2="152" stroke="#d1d5db" stroke-width="2"/>
  </g>
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#9ca3af">Vehicle Image</text>
</svg>
