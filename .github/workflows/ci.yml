name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin

      - name: Typecheck web
        run: npm run typecheck --prefix web

      - name: Typecheck admin
        run: npm run typecheck --prefix admin

      - name: Lint web
        run: npm run lint --prefix web

      - name: Lint admin
        run: npm run lint --prefix admin

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/geely_ethiopia"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin

      - name: Build web
        run: npm run build --prefix web

      - name: Build admin
        run: npm run build --prefix admin

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix admin

      - name: Audit web
        run: npm audit --prefix web --omit=dev --audit-level=critical

      - name: Audit admin
        run: npm audit --prefix admin --omit=dev --audit-level=critical
